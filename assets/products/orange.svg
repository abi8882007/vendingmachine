<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="sheen_orange" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow_orange" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Clean Minimalist Platform Background -->
  <rect width="240" height="240" rx="20" fill="#F8FAFC" />
  <circle cx="120" cy="120" r="85" fill="#EA580C" opacity="0.08" />

  <!-- Render Form Factor with Rich 3D Styling -->
  <g filter="url(#shadow_orange)">
    
      <!-- Bottle Cap -->
      <rect x="106" y="32" width="28" height="16" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- Bottle Neck -->
      <path d="M 110 48 L 110 65 L 85 92 L 85 186 Q 120 196 155 186 L 155 92 L 130 65 L 130 48 Z" fill="url(#grad_orange)" />
      <!-- Specular Reflection -->
      <path d="M 94 95 L 94 175" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
      <!-- Bottle Label -->
      <rect x="85" y="105" width="70" height="52" rx="6" fill="#FFFFFF" fill-opacity="0.92"/>
      <text x="120" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#C2410C" text-anchor="middle">PULPY</text>
      <text x="120" y="146" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#64748B" text-anchor="middle">PURE COLD</text>
    
  </g>
</svg>