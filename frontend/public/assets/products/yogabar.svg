<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_yogabar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="sheen_yogabar" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow_yogabar" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Clean Minimalist Platform Background -->
  <rect width="240" height="240" rx="20" fill="#F8FAFC" />
  <circle cx="120" cy="120" r="85" fill="#15803D" opacity="0.08" />

  <!-- Render Form Factor with Rich 3D Styling -->
  <g filter="url(#shadow_yogabar)">
    
      <!-- Chocolate / Energy Bar Wrapper -->
      <rect x="55" y="65" width="130" height="110" rx="14" fill="url(#grad_yogabar)" />
      <!-- Wrapper Folds & Pinch Ends -->
      <path d="M 50 75 L 55 65 L 55 175 L 50 165 Z" fill="#166534" opacity="0.7"/>
      <path d="M 190 75 L 185 65 L 185 175 L 190 165 Z" fill="#166534" opacity="0.7"/>
      <!-- Sheen Layer -->
      <rect x="58" y="70" width="124" height="25" rx="6" fill="#FFFFFF" opacity="0.25"/>
      <!-- Bold Brand Box -->
      <rect x="65" y="102" width="110" height="38" rx="8" fill="#FFFFFF" fill-opacity="0.95"/>
      <text x="120" y="127" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#15803D" text-anchor="middle" letter-spacing="0.5">YOGA BAR</text>
      <!-- Sub-label -->
      <text x="120" y="158" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PREMIUM BITE</text>
    
  </g>
</svg>